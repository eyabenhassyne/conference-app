<label for="title">Modifier le titre :</label>

<input
  id="title"
  type="text"
  [ngModel]="title()"
  (ngModelChange)="title.set($event)"
>

<h2>{{ title() }}</h2>

<p>Intervenant : {{ speaker() }}</p>

<p>Date : {{ date() }}</p>

<p>Places disponibles : {{ availablePlaces() }}</p>

<button
  (click)="register()"
  [disabled]="availablePlaces() === 0"
>
  S'inscrire
</button>
@if (availablePlaces() === 0) {
  <p>Aucune place disponible.</p>
}
